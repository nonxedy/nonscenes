# nonscenes configuration
# Schema version: 1

settings:
  # DEPRECATED: use cutscene.recording.capture-interval-ticks instead.
  # Kept for backward compatibility; will be removed in a future release.
  frames-per-second: 20

  # Countdown seconds before recording starts
  countdown-seconds: 3

  # Particle settings for path visualization
  path-visualization:
    # Particle type (REDSTONE, FLAME, END_ROD, etc.)
    particle: END_ROD
    # Duration in seconds to show the path
    duration: 30
    # Interval between particles (in blocks)
    spacing: 0.5

# ---------------------------------------------------------------------------
# Cutscene pipeline configuration
# ---------------------------------------------------------------------------
cutscene:
  playback:
    # Target update rate (Hz). Range 20–240.
    # Requires PacketEvents installed on the server.
    update-rate: 60

    # LINEAR      — straight lines between keyframes (fallback).
    # CATMULL_ROM — smooth spline through all keyframes (recommended).
    # BEZIER      — cubic Bezier with auto control points.
    interpolation: CATMULL_ROM

    # Smooth rotation transitions (yaw/pitch wrapping handled automatically)
    smooth-rotation: true

    # Pre-compute the whole trajectory before starting playback.
    # Eliminates runtime interpolation cost and guarantees consistent timing.
    bake-path: true

  creation:
    progress-bar:
      enabled: true
      style: SOLID        # BossBar style: SOLID, SEGMENTED_6, SEGMENTED_10, SEGMENTED_12, SEGMENTED_20
      color: BLUE         # BossBar color: BLUE, GREEN, PINK, PURPLE, RED, WHITE, YELLOW
      update-every-n-frames: 1

  recording:
    # How many server ticks pass between captured frames.
    # 1 = 20 FPS, 2 = 10 FPS, etc.
    capture-interval-ticks: 1

# ---------------------------------------------------------------------------
# Storage configuration (unchanged)
# ---------------------------------------------------------------------------
storage:
  type: SQLITE

  sqlite:
    file-path: "cutscenes.db"

  mysql:
    host: localhost
    port: 3306
    database: minecraft
    username: root
    password: password
    table-prefix: nonscenes_
    pool:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  postgresql:
    host: localhost
    port: 5432
    database: minecraft
    username: postgres
    password: password
    schema: public
    pool:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  mongodb:
    host: localhost
    port: 27017
    database: minecraft
    collection: cutscenes
    username: ""
    password: ""
    options:
      connect-timeout: 10000
      server-selection-timeout: 30000

  redis:
    host: localhost
    port: 6379
    database: 0
    password: ""
    pool:
      max-total: 20
      max-idle: 10
      min-idle: 2
      timeout: 3000

  general:
    auto-create-tables: true
    max-retry-attempts: 3
    retry-delay: 5
